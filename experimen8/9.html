
<!DOCTYPE html>
<html>
<head>
    <title>CSS Background and Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("https://picsum.photos/200/200");
            background-repeat: repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: blue;
            text-align: center;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            
        }
        a{
            text-decoration: none;
            margin: 10px;
            background-color: black;
            padding: 10px;
            border-radius: 10px;
        }

        a:link {
            color: lightgoldenrodyellow;
        }

        a:visited {

            color: lightgoldenrodyellow;
        }

        a:active {
            color: red;
        }

        a:hover {
            color: green;
            background-color: lightseagreen;
            transform: scale(1.2);
        }
        div{
            display: flex;
             max-width:200px;
           background-color: white; 
           margin: 10px;
           padding: 10px;
           border-radius: 10px;
        }
    </style>
</head>

<body>
    <h1>CSS Background and Links</h1>

 <div style="max-width: 300px;">
    <p>Example of different hyperlink styles:</p>
    </div>
  
    <a target="_blank" href="https://www.google.com">Visit Google</a>
    <!-- <br><br>       -->
 
    <a target="_blank" href="https://www.wikipedia.org">Visit Wikipedia</a>
  
</body>
</html>
