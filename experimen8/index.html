
<!DOCTYPE html>
<html>
<head>
    <title>CSS Design</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("https://picsum.photos/1200/800");
            background-size: cover;
            text-align: center;
            color: rgb(178, 14, 14);
        }

        h1 {
            font-family: Georgia, serif;
            color: rgb(214, 3, 70);
        }

        p {
            font-size: 20px;
            font-style: italic;
        }

        .box {
            background-image: url("https://picsum.photos/500/200");
            background-size: cover;
            padding: 30px;
            margin: 50px auto;
            width: 300px;
            border: 2px solid white;
        }
    </style>
</head>

<body>
    <h1>Welcome to My Web Page</h1>

    <p>This page demonstrates different CSS styles.</p>

    <div class="box">
        <h2>CSS Styling</h2>
        <p>Different fonts, colors and backgrounds!</p>
    </div>
</body>
</html>
